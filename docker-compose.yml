# Runs n8n locally. The Node app runs separately with `npm start`.
services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n-local
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678" # reachable from this machine only
    volumes:
      - n8n_data:/home/node/.n8n
    environment:
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-UTC}
      - TZ=${GENERIC_TIMEZONE:-UTC}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-}
    # Lets the workflow call http://host.docker.internal:3000 on Linux too
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  n8n_data:
